<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Timing Results</title>
    <!-- PapaParse for reading CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f8; }
        h1 { text-align: center; color: #333; }
        .search-container { text-align: center; margin-bottom: 20px; }
        input[type="text"] { width: 80%; max-width: 400px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>🏃 Race Timing Results</h1>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="BIB သို့မဟုတ် Runner Name ဖြင့် ရှာပါ...">
    </div>

    <div class="table-container">
        <table id="resultsTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // Load and parse CSV file
        Papa.parse('results.csv', {
            download: true,
            header: true,
            complete: function(results) {
                let data = results.data;
                if (data.length > 0) {
                    let headers = Object.keys(data[0]);
                    let headerTr = document.getElementById('tableHeader');
                    
                    // Generate Headers
                    headers.forEach(h => {
                        let th = document.createElement('th');
                        th.textContent = h;
                        headerTr.appendChild(th);
                    });

                    // Generate Rows
                    let tbody = document.getElementById('tableBody');
                    data.forEach(row => {
                        if (Object.values(row).some(val => val.trim() !== '')) {
                            let tr = document.createElement('tr');
                            headers.forEach(h => {
                                let td = document.createElement('td');
                                td.textContent = row[h] || '';
                                tr.appendChild(td);
                            });
                            tbody.appendChild(tr);
                        }
                    });
                }
            }
        });

        // Search Function
        function searchTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let trs = document.getElementById("tableBody").getElementsByTagName("tr");

            for (let i = 0; i < trs.length; i++) {
                let text = trs[i].textContent || trs[i].innerText;
                if (text.toUpperCase().indexOf(input) > -1) {
                    trs[i].style.display = "";
                } else {
                    trs[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
